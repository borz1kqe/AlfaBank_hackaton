version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: alfa-insight-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
    container_name: alfa-insight-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
